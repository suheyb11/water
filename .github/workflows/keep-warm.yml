# Keeps the Vercel function warm and the Supabase database active by calling /api/health every 5 minutes.
# (GitHub may delay scheduled runs by a few minutes at busy times.)
name: keep-warm
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 --retry 2 https://water-tau-three.vercel.app/api/health
